# Tenant RBAC Template
# 
# 테넌트별 ServiceAccount 및 권한 설정

apiVersion: v1
kind: ServiceAccount
metadata:
  name: tenant-sa
  namespace: tenant-{USER_ID}
  labels:
    tenant: "{USER_ID}"

---
# Role: 테넌트가 자신의 네임스페이스에서 할 수 있는 작업
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tenant-role
  namespace: tenant-{USER_ID}
rules:
  # Pod 조회 권한 (로그 포함)
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/status"]
    verbs: ["get", "list", "watch"]
  
  # Service 조회 권한
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  
  # ConfigMap 조회 권한
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  
  # Knative Service 조회 권한
  - apiGroups: ["serving.knative.dev"]
    resources: ["services", "revisions", "routes"]
    verbs: ["get", "list", "watch"]

---
# RoleBinding: ServiceAccount에 Role 연결
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tenant-rolebinding
  namespace: tenant-{USER_ID}
subjects:
  - kind: ServiceAccount
    name: tenant-sa
    namespace: tenant-{USER_ID}
roleRef:
  kind: Role
  name: tenant-role
  apiGroup: rbac.authorization.k8s.io

---
# Backend용 ClusterRole (모든 테넌트 네임스페이스 관리)
# 주의: 이것은 platform-system 네임스페이스에 적용
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tenant-manager
rules:
  # Namespace 생성/조회
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create", "get", "list", "watch", "update", "patch"]
  
  # 테넌트 네임스페이스 내 리소스 관리
  - apiGroups: [""]
    resources: ["resourcequotas", "limitranges", "serviceaccounts"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  
  # NetworkPolicy 관리
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  
  # RBAC 관리
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  
  # Knative Service 관리
  - apiGroups: ["serving.knative.dev"]
    resources: ["services", "revisions", "routes", "configurations"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]

---
# ClusterRoleBinding: Backend ServiceAccount에 ClusterRole 연결
# 주의: backend-sa는 platform-system 네임스페이스에 있어야 함
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backend-tenant-manager
subjects:
  - kind: ServiceAccount
    name: backend-sa
    namespace: platform-system
roleRef:
  kind: ClusterRole
  name: tenant-manager
  apiGroup: rbac.authorization.k8s.io
