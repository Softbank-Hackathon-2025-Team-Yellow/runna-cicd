apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate
  namespace: observability
spec:
  metrics:
    # 성공률 메트릭 - 에러율 5% 이하 유지
    - name: success-rate
      interval: 1m
      successCondition: result >= 0.95  # 95% 이상 성공률 (에러율 5% 이하)
      failureLimit: 3  # 3회 연속 실패 시 롤백
      provider:
        prometheus:
          address: http://prometheus:9090  # TODO: 모니터링 담당자가 실제 Prometheus 주소로 변경
          query: |
            # TODO: 모니터링 담당자가 실제 메트릭 이름으로 변경
            # 현재는 표준 HTTP 요청 메트릭을 가정
            # 성공률 = 2xx 응답 / 전체 응답
            sum(rate(http_requests_total{status=~"2.."}[5m])) /
            sum(rate(http_requests_total[5m]))
    
    # 응답 지연 시간 메트릭 - 500ms 이하 유지
    - name: latency
      interval: 1m
      successCondition: result <= 500  # 500ms 이하
      failureLimit: 3  # 3회 연속 실패 시 롤백
      provider:
        prometheus:
          address: http://prometheus:9090  # TODO: 모니터링 담당자가 실제 Prometheus 주소로 변경
          query: |
            # TODO: 모니터링 담당자가 실제 메트릭 이름으로 변경
            # 현재는 표준 HTTP 요청 지연 시간 메트릭을 가정
            # P95 지연 시간 (밀리초)
            histogram_quantile(0.95, 
              sum(rate(http_request_duration_seconds_bucket[5m])) by (le)
            ) * 1000
