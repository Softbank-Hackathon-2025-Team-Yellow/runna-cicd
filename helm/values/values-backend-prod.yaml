# Production Environment Configuration
# Uses Argo Rollouts with Blue-Green deployment strategy
# Manual promotion for maximum safety

service:
  name: backend
  type: ClusterIP
  port: 8000

image:
  repository: docker.io/ytjdud79/backend
  tag: latest  # Will be updated by GitHub Actions
  pullPolicy: IfNotPresent

# Docker Hub Private Repository??imagePullSecrets
imagePullSecrets:
  - name: dockerhub-secret

replicaCount: 3

resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 1000m
    memory: 1Gi

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: api.serverless.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: backend-prod-tls
      hosts:
        - api.serverless.example.com

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70

rollout:
  enabled: true
  strategy: blueGreen  # Production uses Blue-Green deployment

# Environment Variables
env:
  # Database Configuration
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: backend-secrets
        key: database-url
  
  # Redis Configuration
  - name: REDIS_HOST
    value: "redis-service"
  - name: REDIS_PORT
    value: "6379"
  - name: REDIS_DB
    value: "0"
  - name: REDIS_PASSWORD
    valueFrom:
      secretKeyRef:
        name: backend-secrets
        key: redis-password
        optional: true
  
  # Knative Configuration
  - name: KNATIVE_URL
    value: "http://knative-serving.knative-serving.svc.cluster.local"
  - name: KNATIVE_TIMEOUT
    value: "30"
  
  # Security Configuration
  - name: SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: backend-secrets
        key: secret-key
  - name: ALGORITHM
    value: "HS256"
  - name: ACCESS_TOKEN_EXPIRE_MINUTES
    value: "30"
  
  # Environment
  - name: ENVIRONMENT
    value: "production"
  - name: DEBUG
    value: "false"
