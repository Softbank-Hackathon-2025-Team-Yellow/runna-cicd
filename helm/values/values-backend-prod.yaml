# Production Environment Configuration
# Uses Argo Rollouts with Blue-Green deployment strategy
# Manual promotion for maximum safety

service:
  name: backend
  type: ClusterIP
  port: 8000

image:
  repository: 123456789.dkr.ecr.us-east-1.amazonaws.com/backend
  tag: latest  # Will be updated by GitHub Actions
  pullPolicy: IfNotPresent

replicaCount: 3

resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 1000m
    memory: 1Gi

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: api.serverless.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: backend-prod-tls
      hosts:
        - api.serverless.example.com

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70

rollout:
  enabled: true
  strategy: blueGreen  # Production uses Blue-Green deployment
