# Development Environment Configuration
# Uses standard Deployment (no Argo Rollouts)
# Minimal resources for cost efficiency

service:
  name: backend
  type: ClusterIP
  port: 8000
image:
  repository: docker.io/ytjdud79/backend
  tag: b73027d272e1059 # Will be updated by GitHub Actions
  pullPolicy: IfNotPresent
# Docker Hub Private Repository imagePullSecrets
imagePullSecrets:
  - name: dockerhub-secret
replicaCount: 1
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi
ingress:
  enabled: true
  className: alb # AWS ALB Ingress Controller
  annotations:
    # ALB Configuration
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '30'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '2'
    # TLS Configuration
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: REPLACE_WITH_ACM_CERT_ARN # TODO: Get from Sohyun
  hosts:
    - host: api-dev.runna.dev # TODO: Change to actual domain
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: backend-dev-tls
      hosts:
        - api-dev.runna.dev
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
rollout:
  enabled: false # Dev uses standard Deployment
  strategy: canary
# Environment Variables
env:
  # Database Configuration
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: backend-secrets
        key: database-url
  # Redis Configuration
  - name: REDIS_HOST
    value: "redis-service"
  - name: REDIS_PORT
    value: "6379"
  - name: REDIS_DB
    value: "0"
  - name: REDIS_PASSWORD
    valueFrom:
      secretKeyRef:
        name: backend-secrets
        key: redis-password
        optional: true
  # Knative Configuration
  - name: KNATIVE_URL
    value: "http://knative-serving.knative-serving.svc.cluster.local"
  - name: KNATIVE_TIMEOUT
    value: "30"
  # Security Configuration
  - name: SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: backend-secrets
        key: secret-key
  - name: ALGORITHM
    value: "HS256"
  - name: ACCESS_TOKEN_EXPIRE_MINUTES
    value: "30"
  # Environment
  - name: ENVIRONMENT
    value: "production"
  - name: DEBUG
    value: "true"
  # Kubernetes Configuration
  - name: KUBERNETES_IN_CLUSTER
    value: "true"
  - name: BASE_DOMAIN
    value: "runna.haifu.cloud"
  - name: K8S_NAMESPACE_PREFIX
    value: "tenant-"
  # Runtime Images
  - name: K8S_PYTHON_IMAGE
    value: "docker.io/sbyellow/python-runtime:latest"
  - name: K8S_NODEJS_IMAGE
    value: "docker.io/sbyellow/node-runner:v1"
  # Gateway API Configuration
  - name: GATEWAY_NAME
    value: "3scale-kourier-gateway"
